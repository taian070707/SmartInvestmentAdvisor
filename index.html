    const CACHE_MAP = new Map();
    const CACHE_TTL = 5 * 60 * 1000;
    let currentAsset = null;
    let currentSeries = [];

    // 1. 全角英数・マイナス記号・7桁投信コード正規化
    function normalizeCode(raw) {
      if (!raw) return "8308";
      let s = raw.trim()
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/[－−ー―]/g, "-")
        .toUpperCase();
      // 名称部分一致検索
      for (const [k, v] of Object.entries(MASTER_DB)) {
        if (v.name.toUpperCase().includes(s) || k === s) return k;
      }
      // 7桁投信コードの場合は先頭0補完して8桁化
      if (/^[0-9]{6}[0-9A-Z]$/.test(s)) {
        s = "0" + s;
      }
      return s;
    }

    // 2. 決定論的シード付きヒストリカル生成（ゼロフリーズ保証用）
    function buildSeries(code, basePrice) {
      let seed = 0;
      for (let i = 0; i < code.length; i++) seed = (seed * 31 + code.charCodeAt(i)) % 100000;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const series = [];
      let p = basePrice * 0.94;
      for (let d = 39; d >= 0; d--) {
        const drift = (rand() - 0.475) * 0.022;
        const open = p;
        const close = d === 0 ? basePrice : p * (1 + drift);
        const high = Math.max(open, close) * (1 + rand() * 0.012);
        const low = Math.min(open, close) * (1 - rand() * 0.012);
        const date = new Date(Date.now() - d * 86400000);
        const label = `${date.getMonth() + 1}/${date.getDate()}`;
        series.push({ label, open, high, low, close });
        p = close;
      }
      // MA5 / MA25 算出
      for (let i = 0; i < series.length; i++) {
        const slice5 = series.slice(Math.max(0, i - 4), i + 1);
        const slice25 = series.slice(Math.max(0, i - 24), i + 1);
        series[i].ma5 = slice5.reduce((a, b) => a + b.close, 0) / slice5.length;
        series[i].ma25 = slice25.reduce((a, b) => a + b.close, 0) / slice25.length;
      }
      return series;
    }

    // 3. クオンツ指標算出 (MA25乖離・Wilder RSI 14日・ボリンジャーσ・5ファクター・CPCV)
    function computeQuantMetrics(asset, series) {
      const n = series.length;
      const last = series[n - 1];
      const ma25 = last.ma25;
      const ma25Dev = ((last.close - ma25) / ma25) * 100;

      // ボリンジャーバンド(25日)
      const slice25 = series.slice(Math.max(0, n - 25));
      const variance = slice25.reduce((acc, d) => acc + Math.pow(d.close - ma25, 2), 0) / slice25.length;
      const std = Math.sqrt(variance) || (last.close * 0.01);
      const sigma = (last.close - ma25) / std;

      // Wilder RSI (14日)
      let avgGain = 0, avgLoss = 0;
      const startIdx = Math.max(1, n - 14);
      for (let i = startIdx; i < n; i++) {
        const diff = series[i].close - series[i - 1].close;
        if (diff > 0) avgGain += diff; else avgLoss -= diff;
      }
      avgGain /= 14; avgLoss /= 14;
      const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
      const rsi = 100 - (100 / (1 + rs));

      // 5ファクタースコア (Value / Momentum / Quality / Stability / MacroFit)
      const regime = document.getElementById("regimeSelect").value;
      const valueScore = asset.category.includes("銀行") ? 86 : 75;
      const momScore = Math.min(95, Math.max(30, Math.round(50 + ma25Dev * 4)));
      const qualScore = MASTER_DB[asset.code] ? 88 : 72;
      const stabScore = asset.leveraged ? 35 : Math.min(92, Math.max(45, Math.round(85 - Math.abs(sigma) * 12)));
      let macroScore = 78;
      if (regime === "boj_hike" && asset.category.includes("銀行")) macroScore = 94;
      if (regime === "risk_off" && asset.code === "1540") macroScore = 95;

      const totalScore = Math.round((valueScore + momScore + qualScore + stabScore + macroScore) / 5);
      const cpcvConf = asset.leveraged ? 64 : Math.min(94, Math.round(78 + (qualScore - 70) * 0.6));

      return { ma25, ma25Dev, std, sigma, rsi, valueScore, momScore, qualScore, stabScore, macroScore, totalScore, cpcvConf };
    }

    // 4. 未登録コード用の決定論的フォールバック生成

    // 5. 高速マルチソース非同期取得 (2.3秒ハードタイムアウト + 5分キャッシュ)
    async function tryLiveUpdate(code) {
      if ( code.length !== 4 ) return;
      const cached = CACHE_MAP.get(code);
      if (cached && (Date.now() - cached.ts < CACHE_TTL)) {
        applyLiveQuote(code, cached.price, cached.prevClose, "5分Cache反映");
        return;
      }
      const badge = document.getElementById("fetchBadge");
      badge.textContent = "⚡ ライブ価格照会中...";
      const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${code}.T?interval=1d&range=5d`;
      const endpoints = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(yahooUrl)}`
      ];

      const fetchWithTimeout = (url, ms) => Promise.race([
        fetch(url).then(r => { if (!r.ok) throw new Error(); return r.json(); }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))
      ]);

      try {
        const data = await Promise.any(endpoints.map(u => fetchWithTimeout(u, 2300)));
        const meta = data?.chart?.result?.[0]?.meta;
        if (meta && meta.regularMarketPrice) {
          const p = Number(meta.regularMarketPrice);
          const prev = Number(meta.chartPreviousClose || meta.previousClose || p);
          CACHE_MAP.set(code, { price: p, prevClose: prev, ts: Date.now() });
          applyLiveQuote(code, p, prev, "Live取得完了");
          return;
        }
      } catch (_) {
        // タイムアウト時は0ms辞書データを維持（フリーズ防止）
      }
      badge.textContent = "0ms 辞書/Cache稼働";
    }

    function applyLiveQuote(code, price, prevClose, statusText) {
      if (!currentAsset || currentAsset.code !== code) return;
      currentAsset.price = price;
      currentAsset.prevClose = prevClose;
      currentSeries = buildSeries(code, price);
      document.getElementById("fetchBadge").textContent = statusText;
      renderCurrentAsset();
    }

    // 6. 検索・選択ハンドラ & 1秒手動価格補正
    function handleSearch() {
      const raw = document.getElementById("codeInput").value;
      selectAsset(raw);
    }

    function selectAsset(rawCode) {
      const code = normalizeCode(rawCode);
      document.getElementById("codeInput").value = code;
      const base = MASTER_DB[code] ? { ...MASTER_DB[code] } : createFallbackAsset(code);
      currentAsset = base;
      currentSeries = buildSeries(code, base.price);
      document.getElementById("manualPriceInput").value = base.price;
      renderCurrentAsset();
      tryLiveUpdate(code);
    }

    function applyManualPrice() {
      const val = parseFloat(document.getElementById("manualPriceInput").value);
      if (!val || val <= 0 || !currentAsset) return;
      currentAsset.price = val;
      currentSeries = buildSeries(currentAsset.code, val);
      document.getElementById("fetchBadge").textContent = "手動価格オーバーライド済";
      renderCurrentAsset();
    }

    // 7. 画面レンダリング (XAI 2段階解説 & 将来予測 & 3-Tranche提案)
    function renderCurrentAsset() {
      if (!currentAsset) return;
      const a = currentAsset;
      const q = computeQuantMetrics(a, currentSeries);
      const diff = a.price - a.prevClose;
      const diffPct = (diff / a.prevClose) * 100;
      const isUp = diff >= 0;
      const unit = a.code.length === 8 ? "円(基準価額)" : "円";

      // 日常比喩アナロジー自動生成
      let analogy = "「百貨店の通常定価販売フェーズ。焦って全額買わず、第1陣の打診買いと押し目指値を併用する好機」";
      if (q.sigma <= -1.0 || q.rsi < 38) {
        analogy = "「優良ブランドの期間限定タイムセール状態。市場の過度な悲観で割安放置されており、押し目買いの好機」";
      } else if (q.sigma >= 1.35 || q.rsi > 68) {
        analogy = "「人気店の行列プレミアム価格。今は高値掴みを避け、25日線付近まで列が落ち着くのを待つ局面」";
      }

      // Header Card
      document.getElementById("headerCard").innerHTML = `
        <div class="flex justify-between items-start gap-2">
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] bg-blue-950 text-blue-300 border border-blue-800 px-2 py-0.5 rounded font-bold">${a.category}</span>
              <span class="text-[10px] text-slate-400 font-mono">Code: ${a.code}</span>
            </div>
            <h2 class="text-sm font-extrabold text-white mt-1 leading-snug">${a.name}</h2>
            <p class="text-[11px] text-slate-400">${a.company}</p>
          </div>
          <div class="text-right shrink-0">
            <div class="text-base font-black text-white">${a.price.toLocaleString()} <span class="text-[10px] font-normal text-slate-400">${unit}</span></div>
            <div class="text-xs font-bold ${isUp ? 'text-emerald-400' : 'text-rose-400'}">
              ${isUp ? '+' : ''}${diff.toFixed(1)} (${isUp ? '+' : ''}${diffPct.toFixed(2)}%)
            </div>
            ${a.pts ? `<div class="text-[10px] text-amber-300">PTS参考: ${a.pts.toLocaleString()}円</div>` : ''}
          </div>
        </div>
        <div class="bg-slate-950/90 border-l-4 border-blue-500 p-2.5 rounded-r-lg text-xs text-slate-200 leading-relaxed">
          💡 <strong>顧客説明用アナロジー:</strong> ${analogy}
        </div>
        ${a.leveraged ? `<div class="bg-rose-950/80 border border-rose-700 text-rose-200 p-2 rounded-lg text-[11px]">⚠️ <strong>減価・短期スイング警告:</strong> レバレッジ型商品のためボックス相場での減価リスクがあります。長期保有には不向きです。</div>` : ''}
      `;

      // 5-Factor & CPCV Card
      document.getElementById("factorCard").innerHTML = `
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-blue-400">📊 5ファクター総合評価 & CPCV信頼度</h3>
          <span class="text-xs font-extrabold bg-blue-950 text-blue-300 border border-blue-700 px-2 py-0.5 rounded">
            総合スコア ${q.totalScore}/100 (CPCV信頼度 ${q.cpcvConf}%)
          </span>
        </div>
        <div class="grid grid-cols-5 gap-1.5 text-center pt-1">
          <div class="bg-slate-950 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">Value</div><div class="text-xs font-bold text-white">${q.valueScore}</div></div>
          <div class="bg-slate-950 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">Momentum</div><div class="text-xs font-bold text-white">${q.momScore}</div></div>
          <div class="bg-slate-950 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">Quality</div><div class="text-xs font-bold text-white">${q.qualScore}</div></div>
          <div class="bg-slate-950 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">Stability</div><div class="text-xs font-bold text-white">${q.stabScore}</div></div>
          <div class="bg-slate-950 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">MacroFit</div><div class="text-xs font-bold text-emerald-400">${q.macroScore}</div></div>
        </div>
      `;

      // XAI STEP 1 & STEP 2 Card
      document.getElementById("xaiCard").innerHTML = `
        <h3 class="text-xs font-bold text-blue-400">🔍 XAI 2ステップ現状解説（窓口トークスクリプト対応）</h3>
        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 space-y-2 text-xs">
          <div class="font-bold text-slate-200">【STEP 1: マーケットファクト（定量・テクニカル位置）】</div>
          <div class="grid grid-cols-3 gap-1.5 text-center">
            <div class="bg-slate-900 p-1.5 rounded"><span class="text-[10px] text-slate-400 block">25日線乖離</span><strong class="${q.ma25Dev >= 0 ? 'text-emerald-400' : 'text-amber-400'}">${q.ma25Dev >= 0 ? '+' : ''}${q.ma25Dev.toFixed(2)}%</strong></div>
            <div class="bg-slate-900 p-1.5 rounded"><span class="text-[10px] text-slate-400 block">Wilder RSI(14)</span><strong>${q.rsi.toFixed(1)} ℃</strong></div>
            <div class="bg-slate-900 p-1.5 rounded"><span class="text-[10px] text-slate-400 block">ボリンジャー位置</span><strong>${q.sigma >= 0 ? '+' : ''}${q.sigma.toFixed(2)}σ</strong></div>
            <div class="bg-slate-900 p-1.5 rounded"><span class="text-[10px] text-slate-400 block">評価/純資産</span><strong>${a.per}</strong></div>
            <div class="bg-slate-900 p-1.5 rounded"><span class="text-[10px] text-slate-400 block">PBR/信託報酬</span><strong>${a.pbr}</strong></div>
            <div class="bg-slate-900 p-1.5 rounded"><span class="text-[10px] text-slate-400 block">利回り/分配</span><strong>${a.yield}</strong></div>
          </div>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 space-y-1 text-xs leading-relaxed text-slate-300">
          <div class="font-bold text-slate-200">【STEP 2: 商品プロファイル & マクロ背景ロジック】</div>
          <p><strong>・商品概要:</strong> ${a.profile}</p>
          <p><strong>・現在の状況解説:</strong> ${a.macroLogic}</p>
        </div>
      `;

      // 今後の動き方予測 & 3段階エントリー計算
      const regime = document.getElementById("regimeSelect").value;
      const dipTarget1 = Math.round(q.ma25);
      const dipTarget2 = Math.round(q.ma25 - 1.2 * q.std);
      const upperTarget = Math.round(q.ma25 + 1.8 * q.std);

      let alloc = [35, 40, 25];
      if (regime === "overheat" || q.sigma > 1.3) alloc = [20, 45, 35];
      if (regime === "risk_off") alloc = [15, 40, 45];
      if (regime === "boj_hike" && a.category.includes("銀行")) alloc = [40, 40, 20];

      document.getElementById("forecastCard").innerHTML = `
        <h3 class="text-xs font-bold text-amber-400">🔮 今後の動き方予測 & 規律ある3分割エントリー提案</h3>
        <div class="space-y-1.5 text-xs">
          <div class="bg-amber-950/30 border border-amber-800/50 p-2.5 rounded-lg text-slate-200 leading-relaxed">
            <strong class="text-amber-300">📈 メインシナリオ（上値目処: ${upperTarget.toLocaleString()}円付近）:</strong><br>
            25日移動平均線（${dipTarget1.toLocaleString()}円）をサポートラインとして意識しつつ、ファンダメンタルズに沿った緩やかな上昇トレンド継続を予測。
          </div>
          <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-slate-300 leading-relaxed">
            <strong class="text-slate-400">📉 下押しリスクシナリオ（押し目目処: ${dipTarget2.toLocaleString()}円 / -1.2σ付近）:</strong><br>
            外部環境の急変時は-1.0σ〜-1.5σ圏（${dipTarget2.toLocaleString()}円前後）までの調整を想定。一括投資を避け、以下の3段階分割で対応します。
          </div>
        </div>
        <div class="space-y-1.5 pt-1 text-xs">
          <div class="flex items-start gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <span class="bg-emerald-900 text-emerald-300 font-bold px-2 py-0.5 rounded text-[10px] shrink-0">第1陣 ${alloc[0]}%</span>
            <span class="text-slate-300"><strong>初期打診エントリー:</strong> 現在値（${a.price.toLocaleString()}円）近辺で予算の${alloc[0]}%をまず構築し、機会損失を防止。</span>
          </div>
          <div class="flex items-start gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <span class="bg-blue-900 text-blue-300 font-bold px-2 py-0.5 rounded text-[10px] shrink-0">第2陣 ${alloc[1]}%</span>
            <span class="text-slate-300"><strong>本命押し目・指値待機:</strong> 25日線〜-1.2σ圏（<strong>${dipTarget2.toLocaleString()}〜${dipTarget1.toLocaleString()}円</strong>）への調整局面で${alloc[1]}%を厚めに追加。</span>
          </div>
          <div class="flex items-start gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
            <span class="bg-purple-900 text-purple-300 font-bold px-2 py-0.5 rounded text-[10px] shrink-0">第3陣 ${alloc[2]}%</span>
            <span class="text-slate-300"><strong>テールリスク予備枠:</strong> 市場全体の急落ショック時の買い増し余力（または定時積立枠）として${alloc[2]}%を温存。</span>
          </div>
        </div>
      `;

      drawChart(null);
    }

    // 8. HTML5 Canvas ローソク足 + MA5/MA25 + タッチクロスヘア描画
    function drawChart(activeIndex) {
      const canvas = document.getElementById("priceChart");
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (!currentSeries.length) return;

      const prices = currentSeries.flatMap(d => [d.high, d.low, d.ma5, d.ma25]);
      const minP = Math.min(...prices) * 0.996;
      const maxP = Math.max(...prices) * 1.004;
      const padL = 8, padR = 46, padT = 12, padB = 18;
      const plotW = w - padL - padR, plotH = h - padT - padB;
      const toY = p => padT + plotH - ((p - minP) / (maxP - minP)) * plotH;
      const stepX = plotW / currentSeries.length;

      // グリッド線と価格ラベル
      ctx.strokeStyle = "#1e293b";
      ctx.fillStyle = "#94a3b8";
      ctx.font = "9px monospace";
      for (let i = 0; i <= 3; i++) {
        const val = minP + ((maxP - minP) * i) / 3;
        const y = toY(val);
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
        ctx.fillText(Math.round(val).toLocaleString(), w - padR + 4, y + 3);
      }

      // ローソク足
      currentSeries.forEach((d, idx) => {
        const x = padL + idx * stepX + stepX / 2;
        const isBull = d.close >= d.open;
        ctx.strokeStyle = isBull ? "#10b981" : "#f43f5e";
        ctx.fillStyle = isBull ? "#10b981" : "#f43f5e";
        ctx.beginPath(); ctx.moveTo(x, toY(d.high)); ctx.lineTo(x, toY(d.low)); ctx.stroke();
        const topY = toY(Math.max(d.open, d.close));
        const bodyH = Math.max(2, Math.abs(toY(d.open) - toY(d.close)));
        ctx.fillRect(x - stepX * 0.3, topY, stepX * 0.6, bodyH);
      });

      // MA5 (黄) & MA25 (水色)
      const drawLine = (key, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
        currentSeries.forEach((d, idx) => {
          const x = padL + idx * stepX + stepX / 2, y = toY(d[key]);
          if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      };
      drawLine("ma5", "#facc15");
      drawLine("ma25", "#38bdf8");

      // タッチクロスヘア
      if (activeIndex !== null && currentSeries[activeIndex]) {
        const d = currentSeries[activeIndex];
        const x = padL + activeIndex * stepX + stepX / 2;
        ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, h - padB); ctx.stroke();
        document.getElementById("chartInspector").textContent =
          `${d.label} 終:${Math.round(d.close).toLocaleString()} MA25:${Math.round(d.ma25).toLocaleString()}`;
      }
    }

    // タッチ・マウスイベント登録
    window.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("priceChart");
      const handlePointer = (clientX) => {
        const rect = canvas.getBoundingClientRect();
        const relX = ((clientX - rect.left) / rect.width) * canvas.width;
        const plotW = canvas.width - 54;
        const idx = Math.min(currentSeries.length - 1, Math.max(0, Math.floor(((relX - 8) / plotW) * currentSeries.length)));
        drawChart(idx);
      };
      canvas.addEventListener("touchmove", e => { e.preventDefault(); handlePointer(e.touches[0].clientX); }, { passive: false });
      canvas.addEventListener("mousemove", e => handlePointer(e.clientX));
      canvas.addEventListener("mouseleave", () => drawChart(null));
      selectAsset("8308");
    });
  </script>
</body>
</html>
