let assetDB = JSON.parse(JSON.stringify(DEFAULT_MASTER));
let currentCat = "all";
let activeModalCode = null;
let activeSeries = [];
const CACHE_MAP = new Map();

function normalizeCode(raw) {
  if (!raw) return "8308";
  let s = raw.trim()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[－−ー―]/g, "-").toUpperCase();
  for (const [k, v] of Object.entries(assetDB)) {
    if (k === s || v.name.toUpperCase().includes(s)) return k;
  }
  if (/^[0-9]{6}[0-9A-Z]$/.test(s)) s = "0" + s;
  return s;
}

function createFallback(code, customName, customPrice) {
  const isFund = code.length === 8;
  const pfx = code.slice(0, 2);
  const co = isFund ? (FUND_PREFIX[pfx] || `投信委託会社(${pfx})`) : `上場企業(${code})`;
  const p = customPrice || (isFund ? 14800 : 2200);
  return {
    code, cat: isFund ? "fund" : "stock", badge: isFund ? "追加型投信" : "国内株式・ETF",
    name: customName || (isFund ? `公募投資信託 (${code})` : `上場銘柄 (${code})`),
    company: co, price: p, prev: Math.round(p * 0.992), pts: isFund ? null : Math.round(p * 1.002),
    m1: isFund ? "純資産 推計500億円+" : "PER 14.5倍", m2: isFund ? "信託報酬 0.45%目安" : "PBR 1.15倍",
    m3: isFund ? "再投資/分配型" : "配当 2.40%", lev: /レバ|ブル|ベア|1570|1458/.test(code + (customName || "")),
    profile: `${co}が運用・発行する金融商品。コード体系から0msプロファイリングを実行。`,
    logic: "市場平均およびセクターの金利・為替感応度に連動。25日線乖離とRSIに応じた3分割エントリーが有効。"
  };
}

function buildSeries(code, basePrice) {
  let seed = 0;
  for (let i = 0; i < code.length; i++) seed = (seed * 31 + code.charCodeAt(i)) % 100000;
  const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const arr = [];
  let p = basePrice * 0.94;
  for (let d = 34; d >= 0; d--) {
    const open = p;
    const close = d === 0 ? basePrice : p * (1 + (rand() - 0.475) * 0.022);
    const high = Math.max(open, close) * (1 + rand() * 0.011);
    const low = Math.min(open, close) * (1 - rand() * 0.011);
    const dt = new Date(Date.now() - d * 86400000);
    arr.push({ label:`${dt.getMonth()+1}/${dt.getDate()}`, open, high, low, close });
    p = close;
  }
  for (let i = 0; i < arr.length; i++) {
    const s5 = arr.slice(Math.max(0, i - 4), i + 1);
    const s25 = arr.slice(Math.max(0, i - 24), i + 1);
    arr[i].ma5 = s5.reduce((a, b) => a + b.close, 0) / s5.length;
    arr[i].ma25 = s25.reduce((a, b) => a + b.close, 0) / s25.length;
  }
  return arr;
}

function calcMetrics(a) {
  const series = buildSeries(a.code, a.price);
  const n = series.length, last = series[n - 1], ma25 = last.ma25;
  const dev = ((last.close - ma25) / ma25) * 100;
  const s25 = series.slice(Math.max(0, n - 25));
  const std = Math.sqrt(s25.reduce((acc, d) => acc + Math.pow(d.close - ma25, 2), 0) / s25.length) || (last.close * 0.01);
  const sigma = (last.close - ma25) / std;

  let gain = 0, loss = 0;
  for (let i = Math.max(1, n - 14); i < n; i++) {
    const df = series[i].close - series[i - 1].close;
    if (df > 0) gain += df; else loss -= df;
  }
  const rs = loss === 0 ? 100 : (gain / 14) / (loss / 14);
  const rsi = 100 - (100 / (1 + rs));

  const regime = document.getElementById("regimeSelect").value;
  const vScore = a.badge.includes("銀行") ? 88 : 76;
  const mScore = Math.min(95, Math.max(35, Math.round(52 + dev * 4)));
  const qScore = DEFAULT_MASTER[a.code] ? 88 : 74;
  const sScore = a.lev ? 35 : Math.min(92, Math.max(45, Math.round(85 - Math.abs(sigma) * 12)));
  let macScore = 78;
  if (regime === "boj_hike" && a.badge.includes("銀行")) macScore = 95;
  if (regime === "risk_off" && a.code === "1540") macScore = 95;
  const total = Math.round((vScore + mScore + qScore + sScore + macScore) / 5);
  const cpcv = a.lev ? 64 : Math.min(94, Math.round(79 + (qScore - 70) * 0.5));
  return { series, ma25, dev, std, sigma, rsi, vScore, mScore, qScore, sScore, macScore, total, cpcv };
}

function getTrancheAlloc(a, q) {
  const regime = document.getElementById("regimeSelect").value;
  if (regime === "overheat" || q.sigma > 1.3) return [20, 45, 35];
  if (regime === "risk_off") return [15, 40, 45];
  if (regime === "boj_hike" && a.badge.includes("銀行")) return [40, 40, 20];
  return [35, 40, 25];
}

function renderAssetList() {
  const container = document.getElementById("assetListContainer");
  const budget = Math.max(10000, parseFloat(document.getElementById("budgetInput").value) || 1000000);
  const sortKey = document.getElementById("sortSelect").value;
  let list = Object.values(assetDB).filter(a => currentCat === "all" || a.cat === currentCat).map(a => ({ a, q: calcMetrics(a) }));

  if (sortKey === "score") list.sort((x, y) => y.q.total - x.q.total);
  if (sortKey === "deviation") list.sort((x, y) => x.q.dev - y.q.dev);

  container.innerHTML = list.map(({ a, q }) => {
    const diff = a.price - a.prev, pct = (diff / a.prev) * 100, isUp = diff >= 0;
    const alloc = getTrancheAlloc(a, q);
    const t1Yen = Math.round((budget * alloc[0]) / 10000);
    const dipPrice = Math.round(q.ma25 - 1.0 * q.std);
    const upTarget = Math.round(q.ma25 + 1.8 * q.std);
    return `
    <article onclick="openAssetDetail('${a.code}')" class="bg-white rounded-2xl border border-slate-200 p-3.5 shadow-xs active:scale-[0.99] transition cursor-pointer space-y-2.5">
      <div class="flex justify-between items-start gap-2">
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded-md">${a.badge}</span>
            <span class="text-[10px] font-mono text-slate-400">${a.code}</span>
            <span class="text-[10px] font-bold bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded">総合 ${q.total}点</span>
          </div>
          <h3 class="text-sm font-extrabold text-slate-800 mt-1">${a.name}</h3>
          <p class="text-[10px] text-slate-400">${a.company}</p>
        </div>
        <div class="text-right shrink-0">
          <div class="text-sm font-black text-slate-900">${a.price.toLocaleString()} <span class="text-[10px] font-normal text-slate-500">円</span></div>
          <div class="text-[11px] font-bold ${isUp ? 'text-emerald-600' : 'text-rose-600'}">${isUp ? '+' : ''}${diff.toFixed(1)} (${isUp ? '+' : ''}${pct.toFixed(2)}%)</div>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-1.5 bg-slate-50 p-2 rounded-xl text-center text-[11px]">
        <div><span class="text-[9px] text-slate-400 block">MA25乖離</span><strong class="${q.dev >= 0 ? 'text-emerald-700' : 'text-amber-700'}">${q.dev >= 0 ? '+' : ''}${q.dev.toFixed(1)}%</strong></div>
        <div><span class="text-[9px] text-slate-400 block">RSI(14)温度感</span><strong>${q.rsi.toFixed(0)}℃ (${q.sigma >= 0 ? '+' : ''}${q.sigma.toFixed(1)}σ)</strong></div>
        <div><span class="text-[9px] text-slate-400 block">初回第1陣(${alloc[0]}%)</span><strong class="text-emerald-700">約${t1Yen}万円</strong></div>
      </div>
      <div class="text-[11px] text-slate-600 bg-emerald-50/50 border border-emerald-100 rounded-xl p-2 flex justify-between items-center">
        <span>🔮 <strong>予測レンジ:</strong> 押し目 ${dipPrice.toLocaleString()}円 〜 上値 ${upTarget.toLocaleString()}円</span>
        <span class="text-emerald-700 font-bold shrink-0">詳細解説 ＞</span>
      </div>
    </article>`;
  }).join("");
}

function openAssetDetail(rawCode) {
  const code = normalizeCode(rawCode);
  if (!assetDB[code]) assetDB[code] = createFallback(code);
  activeModalCode = code;
  const a = assetDB[code], q = calcMetrics(a);
  activeSeries = q.series;
  const budget = Math.max(10000, parseFloat(document.getElementById("budgetInput").value) || 1000000);
  const alloc = getTrancheAlloc(a, q);
  const dip1 = Math.round(q.ma25), dip2 = Math.round(q.ma25 - 1.2 * q.std), upTarget = Math.round(q.ma25 + 1.8 * q.std);

  let analogy = "「百貨店の通常定価フェーズ。全額一括購入は避け、第1陣の打診買いと押し目指値を併用する好機」";
  if (q.sigma <= -1.0 || q.rsi < 38) analogy = "「優良ブランドの期間限定タイムセール状態。市場の悲観で割安放置されており押し目買いの好機」";
  else if (q.sigma >= 1.35 || q.rsi > 68) analogy = "「人気店の行列プレミアム価格。今は高値掴みを避け、25日線付近まで列が落ち着くのを待つ局面」";

  document.getElementById("modalManualPrice").value = a.price;
  document.getElementById("modalTitleArea").innerHTML = `
    <span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded">${a.badge} (${a.code})</span>
    <h2 class="text-sm font-extrabold text-slate-900 mt-1">${a.name}</h2>
    <p class="text-[10px] text-slate-500">${a.company} ｜ 現在値: <strong>${a.price.toLocaleString()}円</strong></p>
  `;

  document.getElementById("modalBodyContent").innerHTML = `
    <div class="bg-emerald-50 border-l-4 border-emerald-600 p-2.5 rounded-r-xl text-xs text-slate-800 leading-relaxed">
      💡 <strong>顧客説明用アナロジー:</strong><br>${analogy}
    </div>
    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2 text-xs">
      <div class="font-extrabold text-emerald-800">📊 現在の状況説明（XAI STEP 1 & STEP 2）</div>
      <div class="grid grid-cols-3 gap-1.5 text-center bg-white p-2 rounded-xl border border-slate-200">
        <div><span class="text-[9px] text-slate-400 block">25日線乖離</span><strong>${q.dev >= 0 ? '+' : ''}${q.dev.toFixed(2)}%</strong></div>
        <div><span class="text-[9px] text-slate-400 block">Wilder RSI</span><strong>${q.rsi.toFixed(1)}℃</strong></div>
        <div><span class="text-[9px] text-slate-400 block">ボリンジャー</span><strong>${q.sigma >= 0 ? '+' : ''}${q.sigma.toFixed(2)}σ</strong></div>
        <div><span class="text-[9px] text-slate-400 block">指標1</span><strong>${a.m1}</strong></div>
        <div><span class="text-[9px] text-slate-400 block">指標2</span><strong>${a.m2}</strong></div>
        <div><span class="text-[9px] text-slate-400 block">指標3</span><strong>${a.m3}</strong></div>
      </div>
      <p class="text-slate-700 leading-relaxed"><strong>・商品プロファイル:</strong> ${a.profile}</p>
      <p class="text-slate-700 leading-relaxed"><strong>・現在の背景ロジック:</strong> ${a.logic}</p>
      <div class="text-[11px] text-slate-500 pt-1 border-t border-slate-200">
        5ファクター評価: Value ${q.vScore} / Mom ${q.mScore} / Qual ${q.qScore} / Stab ${q.sScore} / Macro ${q.macScore} （CPCV統計信頼度 ${q.cpcv}%）
      </div>
    </div>
    <div class="bg-amber-50/70 border border-amber-200 rounded-2xl p-3 space-y-2 text-xs">
      <div class="font-extrabold text-amber-900">🔮 今後の動き方予測 ＆ 3分割エントリー試算</div>
      <p class="text-slate-700 leading-relaxed"><strong>・メイン予測 (上値目処 ${upTarget.toLocaleString()}円):</strong> 25日移動平均線(${dip1.toLocaleString()}円)をサポートに巡航上昇を想定。</p>
      <p class="text-slate-700 leading-relaxed"><strong>・下押しリスク目処 (${dip2.toLocaleString()}円 / -1.2σ):</strong> 外部ショック時は${dip2.toLocaleString()}円近辺までの調整を想定し、予算 <strong>${budget.toLocaleString()}円</strong> を以下の3段階で配分します。</p>
      <div class="space-y-1.5 pt-1">
        <div class="bg-white p-2 rounded-xl border border-amber-200"><strong>第1陣 (${alloc[0]}% / ${(budget*alloc[0]/100).toLocaleString()}円):</strong> 現在値(${a.price.toLocaleString()}円)付近で初期打診エントリー</div>
        <div class="bg-white p-2 rounded-xl border border-amber-200"><strong>第2陣 (${alloc[1]}% / ${(budget*alloc[1]/100).toLocaleString()}円):</strong> 押し目目処(${dip2.toLocaleString()}〜${dip1.toLocaleString()}円)への調整時に指値追加</div>
        <div class="bg-white p-2 rounded-xl border border-amber-200"><strong>第3陣 (${alloc[2]}% / ${(budget*alloc[2]/100).toLocaleString()}円):</strong> 急落ショック時の予備枠（または定時積立枠）として温存</div>
      </div>
    </div>
  `;

  document.getElementById("detailModal").classList.remove("hidden");
  drawModalChart(null);
  tryLiveQuote(code);
}

function closeModal() { document.getElementById("detailModal").classList.add("hidden"); }

function applyModalPriceOverride() {
  const val = parseFloat(document.getElementById("modalManualPrice").value);
  if (!val || val <= 0 || !activeModalCode) return;
  assetDB[activeModalCode].price = val;
  renderAssetList();
  openAssetDetail(activeModalCode);
}

async function tryLiveQuote(code) {
  if (code.length !== 4) return;
  const cached = CACHE_MAP.get(code);
  if (cached && Date.now() - cached.ts < 300000) return;
  const yUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${code}.T?interval=1d&range=5d`;
  const urls = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(yUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(yUrl)}`
  ];
  const raceFetch = u => Promise.race([
    fetch(u).then(r => { if (!r.ok) throw new Error(); return r.json(); }),
    new Promise((_, rej) => setTimeout(() => rej(new Error()), 2200))
  ]);
  try {
    const d = await Promise.any(urls.map(raceFetch));
    const m = d?.chart?.result?.[0]?.meta;
    if (m && m.regularMarketPrice) {
      assetDB[code].price = Number(m.regularMarketPrice);
      assetDB[code].prev = Number(m.chartPreviousClose || m.previousClose || assetDB[code].price);
      CACHE_MAP.set(code, { ts: Date.now() });
      renderAssetList();
    }
  } catch (_) {}
}

function drawModalChart(activeIdx) {
  const canvas = document.getElementById("modalChart"), ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!activeSeries.length) return;
  const allP = activeSeries.flatMap(d => [d.high, d.low, d.ma5, d.ma25]);
  const minP = Math.min(...allP) * 0.996, maxP = Math.max(...allP) * 1.004;
  const padL = 6, padR = 44, padT = 10, padB = 16, plotW = w - padL - padR, plotH = h - padT - padB;
  const toY = p => padT + plotH - ((p - minP) / (maxP - minP)) * plotH;
  const stepX = plotW / activeSeries.length;

  ctx.strokeStyle = "#1e293b"; ctx.fillStyle = "#94a3b8"; ctx.font = "9px monospace";
  for (let i = 0; i <= 3; i++) {
    const val = minP + ((maxP - minP) * i) / 3, y = toY(val);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(Math.round(val).toLocaleString(), w - padR + 3, y + 3);
  }
  activeSeries.forEach((d, i) => {
    const x = padL + i * stepX + stepX / 2, up = d.close >= d.open;
    ctx.strokeStyle = ctx.fillStyle = up ? "#10b981" : "#f43f5e";
    ctx.beginPath(); ctx.moveTo(x, toY(d.high)); ctx.lineTo(x, toY(d.low)); ctx.stroke();
    ctx.fillRect(x - stepX * 0.3, toY(Math.max(d.open, d.close)), stepX * 0.6, Math.max(2, Math.abs(toY(d.open) - toY(d.close))));
  });
  [["ma5","#facc15"],["ma25","#38bdf8"]].forEach(([k, col]) => {
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath();
    activeSeries.forEach((d, i) => {
      const x = padL + i * stepX + stepX / 2, y = toY(d[k]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
  if (activeIdx !== null && activeSeries[activeIdx]) {
    const d = activeSeries[activeIdx], x = padL + activeIdx * stepX + stepX / 2;
    ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, h - padB); ctx.stroke();
    document.getElementById("chartInspector").textContent = `${d.label} 終:${Math.round(d.close).toLocaleString()} MA25:${Math.round(d.ma25).toLocaleString()}`;
  }
}

function handleQuickSearch() {
  const q = document.getElementById("searchInput").value;
  if (!q.trim()) return;
  openAssetDetail(q);
  renderAssetList();
}

function setCategory(cat) {
  currentCat = cat;
  ["all","stock","fund","reit"].forEach(c => {
    const btn = document.getElementById("tab-" + c);
    btn.className = c === cat
      ? "bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-full shrink-0"
      : "bg-white text-slate-600 border border-slate-200 text-xs font-bold px-3 py-1.5 rounded-full shrink-0";
  });
  renderAssetList();
}

function onRegimeChange() {
  const sel = document.getElementById("regimeSelect");
  document.getElementById("regimeBadge").textContent = sel.options[sel.selectedIndex].text.replace(/^[^\s]+\s/, "");
  renderAssetList();
}

function toggleAddBox() { document.getElementById("addBox").classList.toggle("hidden"); }

function addNewAsset() {
  const rawCode = document.getElementById("addCodeInput").value;
  if (!rawCode.trim()) return;
  const code = normalizeCode(rawCode);
  const name = document.getElementById("addNameInput").value.trim();
  const price = parseFloat(document.getElementById("addPriceInput").value);
  assetDB[code] = createFallback(code, name || null, price || null);
  toggleAddBox();
  renderAssetList();
  openAssetDetail(code);
}

function resetDefaultList() {
  assetDB = JSON.parse(JSON.stringify(DEFAULT_MASTER));
  renderAssetList();
}

window.addEventListener("DOMContentLoaded", () => {
  const c = document.getElementById("modalChart");
  const onPtr = cx => {
    const r = c.getBoundingClientRect();
    const relX = ((cx - r.left) / r.width) * c.width;
    const idx = Math.min(activeSeries.length - 1, Math.max(0, Math.floor(((relX - 6) / (c.width - 50)) * activeSeries.length)));
    drawModalChart(idx);
  };
  c.addEventListener("touchmove", e => { e.preventDefault(); onPtr(e.touches[0].clientX); }, { passive: false });
  c.addEventListener("mousemove", e => onPtr(e.clientX));
  c.addEventListener("mouseleave", () => drawModalChart(null));
  renderAssetList();
});
</script>
